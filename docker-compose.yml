services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsechat-backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-pulsechat_production_jwt_secret_key_12345}
      - MONGODB_URL=${MONGODB_URL}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    restart: unless-stopped
    networks:
      - pulsechat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsechat-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pulsechat-network

networks:
  pulsechat-network:
    driver: bridge
